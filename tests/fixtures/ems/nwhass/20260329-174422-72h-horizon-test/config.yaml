server:
  host: 127.0.0.1
  port: 6070
  data_dir: ./data
homeassistant:
  base_url: http://example.invalid
  token: fixture-token
  verify_tls: true
  timeout_seconds: 30.0
ems:
  timestep_minutes: 30
  horizon_minutes: 4320
  high_res_timestep_minutes: 5
  high_res_horizon_minutes: 120
inputs:
  grid_price_import:
    type: forecast
    forecast:
      type: home_assistant
      entity: sensor.amber_general_price
      platform: amber_express
    realtime:
      type: home_assistant
      entity: sensor.amber_general_price
    forecast_expansion:
      history_days: 3
      interval_duration: 30
  grid_price_export:
    type: forecast
    forecast:
      type: home_assistant
      entity: sensor.amber_feed_in_price
      platform: amber_express
    realtime:
      type: home_assistant
      entity: sensor.amber_feed_in_price
    forecast_expansion:
      history_days: 3
      interval_duration: 30
  base_load_power:
    type: forecast
    forecast:
      type: home_assistant
      entity: sensor.hass_energy_load_power_uncontrolled_smoothed_15m
      history_days: 3
      platform: historical_average
      unit: W
      interval_duration: 5
      forecast_horizon_hours: 73
      realtime_window_minutes: 180
    realtime:
      type: home_assistant
      entity: sensor.hass_energy_load_power_uncontrolled_smoothed_1m
    forecast_expansion: null
  pv_forecast:
    type: forecast
    forecast:
      type: home_assistant
      entities:
      - sensor.solcast_pv_forecast_forecast_today
      - sensor.solcast_pv_forecast_forecast_tomorrow
      - sensor.solcast_pv_forecast_forecast_day_3
      - sensor.solcast_pv_forecast_forecast_day_4
      - sensor.solcast_pv_forecast_forecast_day_5
      platform: solcast
    realtime:
      type: home_assistant
      entity: sensor.hass_energy_pv_power_smoothed_1m
    forecast_expansion: null
  eq4800_soc:
    type: scalar
    value_kind: percentage
    source:
      type: home_assistant
      entity: sensor.inverter_battery_soc
  eq4800_realtime_power:
    type: scalar
    value_kind: power
    source:
      type: home_assistant
      entity: sensor.energy_assistant_battery_power_smoothed_1m
  tessie_connected:
    type: scalar
    value_kind: boolean
    source:
      type: home_assistant
      entity: binary_sensor.hass_energy_tessie_connected_at_home
  tessie_can_connect:
    type: scalar
    value_kind: boolean
    source:
      type: home_assistant
      entity: binary_sensor.hass_energy_tessie_can_connect
  tessie_realtime_power:
    type: scalar
    value_kind: power
    source:
      type: home_assistant
      entity: sensor.tesla_wall_connector_power
  tessie_soc:
    type: scalar
    value_kind: percentage
    source:
      type: home_assistant
      entity: sensor.tessie_battery
plant:
  switchboard:
    type: switchboard
    name: null
  grid:
    type: grid
    connection: switchboard
    constraints:
      max_import_kw: 13.0
      max_export_kw: 13.0
    realtime_grid_power: null
    price_import:
      source:
        source: grid_price_import
      filters:
      - type: bias
        bias_pct: 25.0
      - type: risk
        bias_pct: 0.0
        ramp_start_after_minutes: 30
        ramp_duration_minutes: 90
        curve: linear
        import_price_floor: null
        export_price_ceiling: null
    price_export:
      source:
        source: grid_price_export
      filters:
      - type: bias
        bias_pct: 25.0
      - type: risk
        bias_pct: 0.0
        ramp_start_after_minutes: 30
        ramp_duration_minutes: 90
        curve: linear
        import_price_floor: null
        export_price_ceiling: null
    zero_price_export_preference: export
    import_forbidden_periods:
    - start: '14:55'
      end: '21:05'
      months: null
  base_load:
    type: load
    connection: switchboard
    name: Base Load
    power:
      source: base_load_power
  inverter_primary:
    type: inverter
    connection: switchboard
    name: Primary
    peak_power_kw: 10.0
    curtailment: load-aware
  eq4800:
    type: battery
    connection: inverter_primary
    name: EQ4800
    capacity_kwh: 41.9
    storage_efficiency_pct: 95.0
    charge_cost_per_kwh: 0.02
    discharge_cost_per_kwh: 0.02
    soc_value_per_kwh: 0.06
    min_soc_pct: 10.0
    max_soc_pct: 100.0
    reserve_soc_pct: 30.0
    terminal_soc:
      mode: adaptive
      penalty_per_kwh: median
    max_charge_kw: 11.0
    max_discharge_kw: 10.0
    state_of_charge_pct:
      source: eq4800_soc
    realtime_power:
      source: eq4800_realtime_power
  pv:
    type: pv
    connection: inverter_primary
    name: PV
    forecast:
      source: pv_forecast
    forecast_multiplier: 1.0
  tessie:
    type: load_controlled_ev
    connection: switchboard
    name: Tessie
    min_power_kw: 2.4
    max_power_kw: 7.4
    energy_kwh: 78.0
    connected:
      source: tessie_connected
    can_connect:
      source: tessie_can_connect
    allowed_connect_times:
    - start: 08:00
      end: '21:00'
      months: null
    connect_grace_minutes: 60
    realtime_power:
      source: tessie_realtime_power
    state_of_charge_pct:
      source: tessie_soc
    soc_incentives:
    - target_soc_pct: 40.0
      incentive: 0.16
    - target_soc_pct: 60.0
      incentive: 0.12
    - target_soc_pct: 80.0
      incentive: 0.04
    - target_soc_pct: 100.0
      incentive: 0.005
    switch_penalty: 0.02
